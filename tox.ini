[tox]
envlist =
    lint,
    py{310-315}-{requests,niquests},
    docs

[gh-actions]
# this make sure each ci job only run tests once.
# keey it sync with workflows/ci.yaml matrix
python =
    3.10: py310
    3.11: py311
    3.12: py312
    3.13: py313
    3.14: py314
    3.15: py315

[gh-actions:env]
# keep in sync with workflows/ci.yaml matrix
REQUEST_LIB =
    requests: requests
    niquests: niquests

[testenv]
extras =
    requests: requests
    niquests: niquests
deps = -rrequirements/test.txt
commands = pytest --junit-xml pytest.xml --cov=github --cov-report=xml {posargs}

[testenv:lint]
basepython = python3.9
skip_install = true
deps =
    -r requirements/types.txt
    pre-commit
commands =
    pre-commit run --all-files --show-diff-on-failure
    ; Run mypy outside pre-commit because pre-commit runs mypy in a venv
    ; that doesn't have dependencies or their type annotations installed.
    mypy github tests

[testenv:docs]
deps = -rrequirements/docs.txt
basepython = python3.13
skip_install = true
commands = sphinx-build doc build
allowlist_externals = sphinx-build
