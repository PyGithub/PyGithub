[tox]
envlist =
    lint,
    py{310-315},
    docs

[gh-actions]
# this make sure each ci job only run tests once.
# keey it sync with workflows/ci.yaml matrix
python =
    3.10: py310
    3.11: py311
    3.12: py312
    3.13: py313
    3.14: py314
    3.15: py315

[testenv]
deps = -rrequirements/test.txt
commands = pytest --junit-xml pytest.xml --cov=githubasyncio --cov-report=xml {posargs}

[testenv:lint]
basepython = python3.12
skip_install = true
deps =
    -r requirements/types.txt
commands =
    mypy githubasyncio tests

[testenv:docs]
deps = -rrequirements/docs.txt
basepython = python3.13
skip_install = true
commands = sphinx-build doc build
allowlist_externals = sphinx-build
